# ===============================
# Aiven Mysql Server Database
# ===============================
spring.datasource.url=jdbc:mysql://avnadmin:{AIVEN_MYSQL_PASSWORD}@surplus-mysql-surplus-01.g.aivencloud.com:24172/defaultdb?ssl-mode=REQUIRED
spring.datasource.username={AIVEN_MYSQL_USERNAME}
spring.datasource.password={AIVEN_MYSQL_PASSWORD}

# ===============================
# Admin
# ===============================
app.admin.email=admin@gmail.com
app.admin.phone=7845971231
app.admin.password=Admin@123

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Backend url
# ===============================
app.backend.url=http://localhost:8080

# ===============================
# JWT
# ===============================
jwt.secret={JWT_SECRET}
jwt.expiration={JWT_EXPIRATION}
logging.level.org.springframework.security=DEBUG

# ===============================
# Email / SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={EMAIL_ID}
spring.mail.password={PASSWORD}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Frontend URL
# ===============================
app.frontend.url=http://localhost:5173

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=surplus-exchange-platform
cloudinary.api-key={CLOUDINARY_API_KEY}
cloudinary.api-secret={CLOUDINARY_API_SECRET}

# ===============================
# Gemini / Spring AI
# ===============================
spring.ai.google.genai.api-key={GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7

# =====================================================
# AI DEBUG LOGGING
# =====================================================

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat=DEBUG
logging.level.org.springframework.ai.google.genai=DEBUG

# Your AI package
logging.level.com.example.Surplus_Exchange_Platform.ai=DEBUG

# Web request debugging
logging.level.org.springframework.web=DEBUG

# ===============================
# Razorpay
# ===============================
razorpay.key-id={RAZORPAY_KEY}
razorpay.key-secret={RAZORPAY_API_SECRET}

# ===============================
# Kafka - Aiven
# ===============================
spring.kafka.bootstrap-servers=surplus-kafka-surplus-01.i.aivencloud.com:24185

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="{AIVEN_KAFKA_USERNAME}" password="{AIVEN_KAFKA_PASSWORD}";

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer